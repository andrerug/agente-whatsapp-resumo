<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resumo do WhatsApp</title>
<link rel="preload" href="/av/fontes/archivo-latin-variavel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/av/av.css">
<script>
  // Tema: segue o aparelho até a pessoa escolher; a escolha fica salva neste navegador.
  try { const t = localStorage.getItem("tema-resumo"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  [hidden] { display: none !important; }
  body.av { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .av-cabecalho .av-wrap { max-width: none; }
  .nome-app { font-size: var(--av-texto-lg); }
  .status { display: flex; align-items: center; gap: var(--av-esp-2); font-size: var(--av-texto-sm); color: var(--av-texto-suave); }
  .ponto { width: 10px; height: 10px; border-radius: 50%; background: var(--av-linha-forte); flex: none; }
  .ponto.on { background: var(--av-sucesso); }
  .ponto.off { background: var(--av-erro); }

  /* Entrada com senha */
  .entrada { flex: 1; display: grid; place-items: center; padding: var(--av-esp-6) var(--av-margem-lateral); }
  .entrada .av-card { width: min(400px, 100%); }
  .entrada h1 { font-size: var(--av-titulo-3); font-variation-settings: "wdth" 88; margin: 0 0 var(--av-esp-2); }
  .entrada p { color: var(--av-texto-suave); margin: 0 0 var(--av-esp-5); }
  .entrada .av-btn { width: 100%; }

  /* App */
  .layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; height: calc(100vh - 66px); }
  aside { background: var(--av-superficie); border-right: 1px solid var(--av-linha); display: flex; flex-direction: column; min-height: 0; }
  .filtros { padding: var(--av-esp-4); border-bottom: 1px solid var(--av-linha); }
  .filtros .av-campo { margin-bottom: var(--av-esp-3); }
  .chk { display: flex; gap: var(--av-esp-2); align-items: center; font-size: var(--av-texto-sm); color: var(--av-texto-suave); min-height: 32px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--av-primaria); }
  #lista { overflow-y: auto; flex: 1; margin: 0; padding: 0; list-style: none; }
  .conv { width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--av-linha);
          padding: var(--av-esp-3) var(--av-esp-4); min-height: 60px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px var(--av-esp-2); align-items: center; }
  .conv:hover { background: var(--av-superficie-2); }
  .conv[aria-current="true"] { background: var(--av-primaria-suave); box-shadow: inset 4px 0 0 var(--av-primaria); }
  .conv .nome { font-weight: var(--av-peso-forte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .meta { grid-column: 1; font-size: var(--av-texto-xs); color: var(--av-texto-suave); }
  .conv .av-tag { grid-row: 1 / span 2; grid-column: 2; background: var(--av-primaria); color: var(--av-sobre-primaria); }
  .conv.todas .nome { color: var(--av-primaria); }
  .lista-msg { padding: var(--av-esp-4); color: var(--av-texto-suave); font-size: var(--av-texto-sm); }

  main { overflow-y: auto; padding: var(--av-esp-6) clamp(16px, 3vw, 48px); }
  .vazio { max-width: 420px; margin: 14vh auto 0; text-align: center; color: var(--av-texto-suave); }
  .vazio h2 { font-size: var(--av-titulo-3); color: var(--av-texto); margin: 0 0 var(--av-esp-2); font-variation-settings: "wdth" 88; }
  .titulo { font-size: var(--av-titulo-2); font-variation-settings: "wdth" 82; line-height: var(--av-altura-titulo); margin: 0 0 var(--av-esp-4); max-width: 900px; overflow-wrap: anywhere; }
  .controles { display: flex; flex-wrap: wrap; gap: var(--av-esp-3); align-items: flex-end; margin-bottom: var(--av-esp-5); max-width: 900px; }
  .controles .av-campo { margin: 0; flex: 1 1 240px; }
  .periodos { display: flex; flex-wrap: wrap; gap: var(--av-esp-2); margin-bottom: var(--av-esp-4); }
  .periodos .av-aba[aria-pressed="true"] { background: var(--av-primaria); border-color: var(--av-primaria); color: var(--av-sobre-primaria); }
  .abas { display: flex; gap: var(--av-esp-1, 4px); border-bottom: 1px solid var(--av-linha); margin-bottom: var(--av-esp-4); max-width: 900px; }
  .abas button { font: inherit; font-weight: var(--av-peso-medio); background: none; border: 0; border-bottom: 3px solid transparent; color: var(--av-texto-suave);
                 min-height: 44px; padding: 0 var(--av-esp-4); cursor: pointer; }
  .abas button[aria-selected="true"] { color: var(--av-texto); border-bottom-color: var(--av-marca); }
  .resultado { max-width: 900px; }
  .md h2 { font-size: var(--av-titulo-4); margin: var(--av-esp-6) 0 var(--av-esp-2); padding-top: var(--av-esp-4); border-top: 1px solid var(--av-linha); }
  .md h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .md h3 { font-size: var(--av-texto-lg); margin: var(--av-esp-4) 0 var(--av-esp-2); }
  .md p { margin: var(--av-esp-2) 0; max-width: var(--av-largura-texto); }
  .md ul, .md ol { margin: var(--av-esp-2) 0; padding-left: 22px; max-width: var(--av-largura-texto); }
  .md li { margin: 4px 0; }
  .md a { color: var(--av-primaria); overflow-wrap: anywhere; }
  .md .rodape { color: var(--av-texto-suave); font-size: var(--av-texto-sm); }
  .msg { padding: var(--av-esp-3) 0; border-bottom: 1px solid var(--av-linha); }
  .msg:last-child { border-bottom: 0; }
  .msg .cab { font-size: var(--av-texto-xs); color: var(--av-texto-suave); }
  .msg .cab b { color: var(--av-texto); font-size: var(--av-texto-sm); }
  .msg.eu .cab b { color: var(--av-primaria); }
  .msg .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
  .carregando { display: flex; align-items: center; gap: var(--av-esp-3); color: var(--av-texto-suave); }
  .spin { width: 20px; height: 20px; border: 3px solid var(--av-linha); border-top-color: var(--av-primaria); border-radius: 50%; animation: g .8s linear infinite; flex: none; }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
  #toast { position: fixed; bottom: var(--av-esp-5); left: 50%; transform: translateX(-50%); background: var(--av-texto); color: var(--av-fundo);
           padding: var(--av-esp-3) var(--av-esp-4); border-radius: var(--av-raio-p); font-size: var(--av-texto-sm); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  #toast.on { opacity: 1; }
  .so-leitura { white-space: nowrap; }
  .acoes { display: flex; align-items: center; gap: var(--av-esp-2); flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--av-linha); }
    main { padding: var(--av-esp-5) var(--av-margem-lateral); }
    .status-texto { display: none; }
    .av-cabecalho .av-wrap { flex-wrap: wrap; padding-block: var(--av-esp-2); }
  }
</style>
</head>
<body class="av">
<a class="av-pular" href="#principal">Pular para o conteúdo</a>
<header class="av-cabecalho">
  <div class="av-wrap">
    <span class="av-marca"><span class="av-marca-simbolo" aria-hidden="true"></span><span class="nome-app">Resumo do WhatsApp</span></span>
    <div class="acoes">
      <span class="av-tag av-tag--sucesso so-leitura" title="Este agente só lê. Ele não envia, não apaga e não marca nada como lido.">Somente leitura</span>
      <span class="status" id="status" hidden><span class="ponto" id="ponto"></span><span class="status-texto" id="txtStatus">verificando</span></span>
      <button class="av-btn av-btn--secundario av-btn--pequeno" id="btnSync" hidden title="Baixa as mensagens novas do celular. Não envia nada.">Atualizar mensagens</button>
      <button class="av-btn av-btn--fantasma av-btn--pequeno" id="btnTema" aria-label="Trocar tema claro ou escuro">Tema</button>
      <button class="av-btn av-btn--fantasma av-btn--pequeno" id="btnSair" hidden>Sair</button>
    </div>
  </div>
</header>

<section class="entrada" id="telaEntrada" hidden>
  <form class="av-card" id="formEntrada">
    <h1>Entrar</h1>
    <p>Esta página mostra as suas conversas. Digite a senha para continuar.</p>
    <div class="av-campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
      <span class="av-erro-msg" id="erroEntrada" role="alert"></span>
    </div>
    <button class="av-btn av-btn--primario" type="submit" id="btnEntrar">Entrar</button>
  </form>
</section>

<div class="layout" id="telaApp" hidden>
  <aside aria-label="Conversas">
    <div class="filtros">
      <div class="av-campo">
        <label for="busca">Buscar conversa ou grupo</label>
        <input type="search" id="busca" autocomplete="off" placeholder="Nome do contato ou do grupo">
      </div>
      <label class="chk"><input type="checkbox" id="naoLidas"> Só as que têm mensagens não lidas</label>
    </div>
    <ul id="lista"></ul>
  </aside>
  <main id="principal" tabindex="-1">
    <div class="vazio"><h2>Escolha uma conversa</h2><p>Ou comece por "Tudo o que recebi" para ver um resumo de todas as conversas.</p></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const estado = { conv: null, periodo: "24h", aba: "resumo", resumo: null, msgs: null, claude: true };
const PERIODOS = [["hoje","Hoje"],["24h","Últimas 24 h"],["3d","3 dias"],["7d","7 dias"],["30d","30 dias"]];

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2800); }
async function api(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo), credentials: "same-origin" } : { credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.erro === "SENHA") { mostrarEntrada(); throw new Error("Entre com a senha."); }
  if (!r.ok) throw new Error(j.erro || "erro");
  return j;
}
function quando(ts) {
  if (!ts) return "";
  const d = new Date(ts), h = new Date();
  if (d.toDateString() === h.toDateString()) return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

// Markdown simples (títulos, negrito, itálico, listas, links)
function md(t) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>")
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  let html = "", lista = null;
  const fecha = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  for (const l of t.split(/\r?\n/)) {
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { fecha(); const n = Math.max(2, m[1].length); html += `<h${n}>${inline(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== "ul") { fecha(); html += "<ul>"; lista = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== "ol") { fecha(); html += "<ol>"; lista = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) { fecha(); }
    else { fecha(); html += `<p>${inline(l)}</p>`; }
  }
  fecha();
  return html;
}

// ---------- entrada ----------
function mostrarEntrada() {
  $("#telaApp").hidden = true; $("#status").hidden = true; $("#btnSync").hidden = true; $("#btnSair").hidden = true;
  $("#telaEntrada").hidden = false; setTimeout(() => $("#senha").focus(), 50);
}
function mostrarApp(precisaSenha) {
  $("#telaEntrada").hidden = true; $("#telaApp").hidden = false;
  $("#status").hidden = false; $("#btnSync").hidden = false; $("#btnSair").hidden = !precisaSenha;
  carregarStatus(); carregarLista();
}
$("#formEntrada").onsubmit = async ev => {
  ev.preventDefault();
  const b = $("#btnEntrar"); b.disabled = true; b.textContent = "Entrando…"; $("#erroEntrada").textContent = "";
  $("#senha").removeAttribute("aria-invalid");
  try {
    const r = await fetch("/api/entrar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ senha: $("#senha").value }), credentials: "same-origin" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || "Não foi possível entrar.");
    $("#senha").value = ""; mostrarApp(true);
  } catch (e) {
    $("#erroEntrada").textContent = e.message; $("#senha").setAttribute("aria-invalid", "true"); $("#senha").select();
  } finally { b.disabled = false; b.textContent = "Entrar"; }
};
$("#btnSair").onclick = async () => { try { await fetch("/api/sair", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch (e) {} location.reload(); };

// ---------- tema ----------
$("#btnTema").onclick = () => {
  const atual = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const novo = atual === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem("tema-resumo", novo); } catch (e) {}
};

// ---------- app ----------
async function carregarStatus() {
  try {
    const s = await api("/api/status");
    $("#ponto").className = "ponto " + (s.conectado ? "on" : "off");
    $("#txtStatus").textContent = s.conectado ? "WhatsApp conectado" : "WhatsApp desconectado";
    $("#status").title = s.conectado ? "WhatsApp conectado" : "WhatsApp desconectado: é preciso ler o QR code de novo no servidor.";
    estado.claude = s.claude;
  } catch { $("#txtStatus").textContent = "não foi possível verificar"; }
}

let tBusca, listaAtual = [];
const TODAS = { jid: "*", nome: "Tudo o que recebi", tipo: "todas as conversas", nao_lidas: 0 };
async function carregarLista() {
  const q = new URLSearchParams({ busca: $("#busca").value.trim(), nao_lidas: $("#naoLidas").checked ? "1" : "0" });
  $("#lista").innerHTML = '<li class="lista-msg"><span class="carregando"><span class="spin"></span>Carregando conversas…</span></li>';
  try {
    const lista = await api("/api/conversas?" + q);
    listaAtual = [TODAS, ...lista];
    $("#lista").innerHTML = listaAtual.map(c => `
      <li><button class="conv ${c.jid === "*" ? "todas" : ""}" data-jid="${esc(c.jid)}" aria-current="${estado.conv && estado.conv.jid === c.jid}">
        <span class="nome">${esc(c.nome)}</span>
        ${c.nao_lidas ? `<span class="av-tag" title="${c.nao_lidas} não lidas">${c.nao_lidas > 999 ? "999+" : c.nao_lidas}</span>` : ""}
        <span class="meta">${esc(c.tipo)}${c.ultima ? " às " + quando(c.ultima) : ""}</span>
      </button></li>`).join("") + (lista.length ? "" : '<li class="lista-msg">Nenhuma conversa com esse nome.</li>');
    $("#lista").querySelectorAll(".conv").forEach(el => el.onclick = () => selecionar(listaAtual.find(x => x.jid === el.dataset.jid)));
  } catch (e) { $("#lista").innerHTML = `<li class="lista-msg">Não carregou as conversas: ${esc(e.message)}</li>`; }
}

function selecionar(c) {
  estado.conv = c; estado.resumo = null; estado.msgs = null;
  document.querySelectorAll(".conv").forEach(el => el.setAttribute("aria-current", el.dataset.jid === c.jid));
  desenhar();
  if (matchMedia("(max-width: 820px)").matches) $("#principal").focus();
}

function desenhar() {
  const c = estado.conv;
  if (!c) return;
  $("#principal").innerHTML = `
    <h1 class="titulo">${esc(c.nome)}</h1>
    <div class="periodos" role="group" aria-label="Período">${PERIODOS.map(([v, t]) => `<button class="av-aba" data-p="${v}" aria-pressed="${estado.periodo === v}">${t}</button>`).join("")}</div>
    <div class="controles">
      <div class="av-campo"><label for="foco">Foco (opcional)</label><input type="text" id="foco" placeholder="prazos, ofício, reunião…"></div>
      <button class="av-btn av-btn--primario" id="btnResumir">Resumir</button>
      <button class="av-btn av-btn--secundario" id="btnCopiar" title="Copia as mensagens com as instruções para colar em qualquer chat do Claude">Copiar para o Claude</button>
    </div>
    <div class="abas" role="tablist">
      <button role="tab" data-a="resumo" aria-selected="${estado.aba === "resumo"}">Resumo</button>
      <button role="tab" data-a="msgs" aria-selected="${estado.aba === "msgs"}">Mensagens</button>
    </div>
    <div id="conteudo" class="resultado" role="tabpanel"></div>`;
  document.querySelectorAll(".periodos button").forEach(b => b.onclick = () => { estado.periodo = b.dataset.p; estado.resumo = null; estado.msgs = null; desenhar(); });
  document.querySelectorAll(".abas button").forEach(b => b.onclick = () => { estado.aba = b.dataset.a; desenhar(); });
  $("#btnResumir").onclick = resumir;
  $("#btnCopiar").onclick = copiar;
  conteudo();
}

async function obterMsgs() {
  if (!estado.msgs) estado.msgs = await api(`/api/mensagens?jid=${encodeURIComponent(estado.conv.jid)}&periodo=${estado.periodo}`);
  return estado.msgs;
}

async function conteudo() {
  const el = $("#conteudo");
  if (estado.aba === "resumo") {
    if (estado.resumo) { el.innerHTML = `<div class="av-card md">${md(estado.resumo)}</div>`; return; }
    el.innerHTML = `<div class="av-card"><p class="av-suave" style="margin:0">Clique em <b>Resumir</b>: o Claude lê as mensagens do período e organiza pedidos, prazos e decisões.</p></div>`;
    return;
  }
  el.innerHTML = '<div class="carregando"><span class="spin"></span>Lendo as mensagens…</div>';
  try {
    const m = await obterMsgs();
    const todas = estado.conv.jid === "*";
    el.innerHTML = `<div class="av-card">${m.itens.length ? m.itens.map(i => `
      <div class="msg ${i.eu ? "eu" : ""}"><div class="cab"><b>${esc(i.quem)}</b>${todas ? " em " + esc(i.conversa) : ""}, ${esc(i.hora)}</div>
      <div class="tx">${esc(i.texto)}</div></div>`).join("") : "<p style='margin:0'>Nenhuma mensagem nesse período. Escolha um período maior.</p>"}
      ${m.ultima_sync ? `<p class="av-suave" style="font-size:var(--av-texto-sm);margin:var(--av-esp-3) 0 0">Mensagens atualizadas em ${esc(m.ultima_sync)}.</p>` : ""}</div>`;
  } catch (e) { el.innerHTML = `<div class="av-aviso av-aviso--erro">Não consegui ler as mensagens: ${esc(e.message)}</div>`; }
}

async function resumir() {
  estado.aba = "resumo"; desenhar();
  const foco = $("#foco").value.trim();
  const el = $("#conteudo"); const btn = $("#btnResumir"); btn.disabled = true; btn.textContent = "Resumindo…";
  el.innerHTML = '<div class="carregando"><span class="spin"></span>O Claude está lendo e resumindo. Pode levar até 1 minuto.</div>';
  try {
    const r = await api("/api/resumir", { jid: estado.conv.jid, nome: estado.conv.nome, periodo: estado.periodo, foco });
    estado.resumo = r.resumo + (r.qtd ? `\n\n_${r.qtd} mensagens lidas._` : "");
    el.innerHTML = `<div class="av-card md">${md(estado.resumo)}</div>`;
  } catch (e) {
    if (e.message === "SEM_LOGIN" || e.message === "SEM_CLAUDE") {
      el.innerHTML = `<div class="av-aviso av-aviso--atencao"><div><b>O resumo automático precisa do login do Claude neste servidor.</b><br>
        Enquanto isso, use <b>Copiar para o Claude</b> e cole numa conversa do Claude.</div></div>`;
    } else el.innerHTML = `<div class="av-aviso av-aviso--erro"><div><b>O resumo não saiu.</b> ${esc(e.message)}<br>Tente de novo em alguns segundos.</div></div>`;
  } finally { btn.disabled = false; btn.textContent = "Resumir"; }
}

async function copiar() {
  try {
    const m = await obterMsgs();
    if (!m.itens.length) return toast("Nenhuma mensagem nesse período.");
    const foco = $("#foco").value.trim();
    const texto = `Resuma estas mensagens de WhatsApp (${estado.conv.nome}). Para cada conversa: resumo em 2-3 linhas, pedidos para mim (minhas mensagens aparecem como "Eu"), prazos e datas, decisões. No fim, "O que fazer agora" em ordem de urgência. Ignore figurinhas e cumprimentos. Não repita telefones nem dados pessoais.${foco ? " Foco: " + foco + "." : ""}\n\n<mensagens>\n${m.texto}\n</mensagens>`;
    await navigator.clipboard.writeText(texto);
    toast(`${m.itens.length} mensagens copiadas. Cole numa conversa do Claude.`);
  } catch (e) { toast("Não copiou: " + e.message); }
}

$("#btnSync").onclick = async () => {
  const b = $("#btnSync"); b.disabled = true; b.textContent = "Atualizando…";
  try { await api("/api/atualizar", {}); toast("Mensagens atualizadas."); estado.msgs = null; await carregarLista(); if (estado.conv) desenhar(); }
  catch (e) { toast("Não atualizou: " + e.message); }
  finally { b.disabled = false; b.textContent = "Atualizar mensagens"; }
};
$("#busca").oninput = () => { clearTimeout(tBusca); tBusca = setTimeout(carregarLista, 300); };
$("#naoLidas").onchange = carregarLista;

(async () => {
  try {
    const s = await (await fetch("/api/sessao", { credentials: "same-origin" })).json();
    s.logado ? mostrarApp(s.precisa_senha) : mostrarEntrada();
  } catch { mostrarEntrada(); }
})();
</script>
</body>
